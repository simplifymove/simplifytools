version: '3.9'

services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: cobalt
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      # Cobalt configuration
      PORT: "9000"
      # Optional: Add COBALT_WORKER_URL if using external worker
      # COBALT_WORKER_URL: "https://..."
    volumes:
      - ./logs:/app/logs
    networks:
      - cobalt-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

networks:
  cobalt-network:
    driver: bridge
