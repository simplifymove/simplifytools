name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure deployment
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          
          # Store SSH key
          cat > ~/.ssh/deploy_key << 'EOF'
          ${{ secrets.VPS_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key
          
          # Add host to known hosts
          echo "🔐 Configuring SSH..."
          ssh-keyscan -p 22 75.119.155.15 >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Test connectivity
          echo "🧪 Testing SSH connectivity..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            root@75.119.155.15 "echo 'SSH connection successful'" || { echo "❌ SSH connection failed"; exit 1; }

      - name: Deploy application
        run: |
          echo "🚀 Starting deployment..."
          
          # Kill old npm processes and free port 3000
          echo "🛑 Stopping old processes..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@75.119.155.15 \
            "pkill -9 -f 'npm start' || true; sleep 1" || true
          
          # Pull latest code
          echo "📥 Pulling latest code..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@75.119.155.15 \
            "cd /var/www/simplifyconvertapp && git pull origin main --quiet" || { echo "❌ Git pull failed"; exit 1; }
          
          # Install dependencies
          echo "📦 Installing dependencies..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@75.119.155.15 \
            "cd /var/www/simplifyconvertapp && npm ci --silent" || { echo "❌ npm ci failed"; exit 1; }
          
          # Build application
          echo "🏗️ Building application..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@75.119.155.15 \
            "cd /var/www/simplifyconvertapp && rm -rf .next .turbo && npm run build" || { echo "❌ Build failed"; exit 1; }
          
          # Verify build
          echo "✅ Verifying build..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@75.119.155.15 \
            "test -d /var/www/simplifyconvertapp/.next && echo '✅ Build verified successfully'" || { echo "❌ Build verification failed"; exit 1; }
          
          # Start the application
          echo "🟢 Starting application..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@75.119.155.15 \
            "cd /var/www/simplifyconvertapp && npm start > /tmp/app.log 2>&1 &" || { echo "⚠️ App start command sent"; }
          
          # Give app time to start
          sleep 3
          
          # Verify app is running
          echo "🔍 Verifying app is running..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@75.119.155.15 \
            "curl -s http://localhost:3000 | head -1 | grep -q 'html' && echo '✅ App is responding!' || echo '⚠️ App may still be starting...'" || true
          
          echo "✨ Deployment completed successfully!"
