name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure deployment
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          
          # Store SSH key
          cat > ~/.ssh/deploy_key << 'EOF'
          ${{ secrets.VPS_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key
          
          # Add host to known hosts
          echo "🔐 Configuring SSH..."
          ssh-keyscan -p 22 75.119.155.15 >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Test connectivity
          echo "🧪 Testing SSH connectivity..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            root@75.119.155.15 "echo 'SSH connection successful'" || { echo "❌ SSH connection failed"; exit 1; }

      - name: Deploy application
        run: |
          echo "🚀 Starting deployment..."
          
          # Kill old npm processes and free port 3000
          echo "🛑 Stopping old processes..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@75.119.155.15 \
            "pkill -9 -f 'npm start' || true; sleep 1" || true
          
          # Pull latest code
          echo "📥 Pulling latest code..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@75.119.155.15 \
            "cd /var/www/simplifyconvertapp && git pull origin main --quiet" || { echo "❌ Git pull failed"; exit 1; }
          
          # Install dependencies
          echo "📦 Installing dependencies..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@75.119.155.15 \
            "cd /var/www/simplifyconvertapp && npm ci --silent" || { echo "❌ npm ci failed"; exit 1; }
          
          # Provision the Python Playwright package and its matching Chromium
          # revision in an application-local cache. Version markers and an
          # executable check keep this idempotent across ordinary deployments.
          echo "Provisioning URL-to-PDF browser runtime..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@75.119.155.15 '
            set -eu
            APP_DIR=/var/www/simplifyconvertapp
            PYTHON_BIN="$APP_DIR/venv/bin/python"
            BROWSER_DIR="$APP_DIR/.playwright-browsers"
            PLAYWRIGHT_VERSION=$(sed -n "s/^playwright==//p" "$APP_DIR/requirements-vps.txt")
            test -n "$PLAYWRIGHT_VERSION"
            BROWSER_MARKER="$BROWSER_DIR/.playwright-version"
            DEPS_MARKER="$BROWSER_DIR/.system-deps-$PLAYWRIGHT_VERSION"

            INSTALLED_VERSION=$("$PYTHON_BIN" -c "import importlib.metadata; print(importlib.metadata.version(\"playwright\"))" 2>/dev/null || true)
            if [ "$INSTALLED_VERSION" != "$PLAYWRIGHT_VERSION" ]; then
              "$PYTHON_BIN" -m pip install --disable-pip-version-check "playwright==$PLAYWRIGHT_VERSION"
            fi

            mkdir -p "$BROWSER_DIR"
            if [ ! -f "$DEPS_MARKER" ]; then
              PLAYWRIGHT_BROWSERS_PATH="$BROWSER_DIR" "$PYTHON_BIN" -m playwright install-deps chromium
              touch "$DEPS_MARKER"
            fi

            INSTALLED_MARKER=$(cat "$BROWSER_MARKER" 2>/dev/null || true)
            BROWSER_EXECUTABLE=$(PLAYWRIGHT_BROWSERS_PATH="$BROWSER_DIR" "$PYTHON_BIN" -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
            if [ "$INSTALLED_MARKER" != "$PLAYWRIGHT_VERSION" ] || [ ! -x "$BROWSER_EXECUTABLE" ]; then
              PLAYWRIGHT_BROWSERS_PATH="$BROWSER_DIR" "$PYTHON_BIN" -m playwright install chromium
              printf "%s\n" "$PLAYWRIGHT_VERSION" > "$BROWSER_MARKER"
              chmod -R a+rX "$BROWSER_DIR"
            fi

            BROWSER_EXECUTABLE=$(PLAYWRIGHT_BROWSERS_PATH="$BROWSER_DIR" "$PYTHON_BIN" -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
            test -x "$BROWSER_EXECUTABLE"
          ' || { echo "URL-to-PDF browser provisioning failed"; exit 1; }

          # Build application
          echo "🏗️ Building application..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@75.119.155.15 \
            "cd /var/www/simplifyconvertapp && rm -rf .next .turbo && npm run build" || { echo "❌ Build failed"; exit 1; }
          
          # Verify build
          echo "✅ Verifying build..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@75.119.155.15 \
            "test -d /var/www/simplifyconvertapp/.next && echo '✅ Build verified successfully'" || { echo "❌ Build verification failed"; exit 1; }
          
          # Start the application
          echo "🟢 Starting application..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@75.119.155.15 \
            "cd /var/www/simplifyconvertapp && npm start > /tmp/app.log 2>&1 &" || { echo "⚠️ App start command sent"; }
          
          # Give app time to start
          sleep 3
          
          # Verify app is running
          echo "🔍 Verifying app is running..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@75.119.155.15 \
            "curl -s http://localhost:3000 | head -1 | grep -q 'html' && echo '✅ App is responding!' || echo '⚠️ App may still be starting...'" || true
          
          echo "✨ Deployment completed successfully!"
