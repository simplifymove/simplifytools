name: Emergency Rollback

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Rollback action'
        required: true
        default: 'restart'
        type: choice
        options:
          - restart
          - stop
          - status

env:
  VPS_HOST: 75.119.155.15
  VPS_USER: root
  APP_PATH: /var/www/simplifyconvertapp

jobs:
  rollback:
    name: Execute Rollback Action
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/deploy_key << 'EOF'
          ${{ secrets.VPS_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Restart Application
        if: github.event.inputs.action == 'restart'
        run: |
          echo "🔄 Restarting application..."
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "pm2 restart simplifyconvertapp && sleep 3 && pm2 status"

      - name: Stop Application
        if: github.event.inputs.action == 'stop'
        run: |
          echo "⛔ Stopping application..."
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "pm2 stop simplifyconvertapp && pm2 status"

      - name: Check Status
        if: github.event.inputs.action == 'status'
        run: |
          echo "📊 Checking application status..."
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "echo '--- PM2 Status ---' && pm2 status && echo && echo '--- Recent Logs ---' && pm2 logs simplifyconvertapp --lines 20 --nostream"

      - name: Summary
        if: always()
        run: |
          echo "✅ Rollback action completed: ${{ github.event.inputs.action }}"
